name: Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets-scan:
    name: Secrets Scan (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

  dependency-scan:
    name: Dependency Scan (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner bilan skanerlash
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --lockfile=app/requirements.txt

  build:
    name: Docker image yig'ish
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast-scan, dependency-scan]
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "image_tag=cicd-demo:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Docker image yig'ish
        run: docker build -t ${{ steps.vars.outputs.image_tag }} .
      - name: Image'ni fayl sifatida saqlash (keyingi job uchun)
        run: docker save ${{ steps.vars.outputs.image_tag }} -o /tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  image-scan:
    name: Container & SBOM Scan (Trivy, Syft, Grype)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Image'ni yuklash
        run: docker load -i /tmp/image.tar

      - name: Trivy bilan skanerlash
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build.outputs.image_tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Syft bilan SBOM yaratish
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.build.outputs.image_tag }}
          output-file: sbom.json
          format: cyclonedx-json

      - name: Grype bilan SBOM'ni skanerlash
        uses: anchore/scan-action@v4
        with:
          sbom: sbom.json
          fail-build: true
          severity-cutoff: high

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.json
          retention-days: 30