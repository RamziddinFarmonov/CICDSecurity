name: Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Docker image yig'ish
        run: docker build -t cicd-demo:${{ github.sha }} .